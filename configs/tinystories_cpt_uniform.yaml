data:
  cache: data/tinystories
  window: 512
  block: 16
  carry: 128
model:
  latent_dim: 48
  width: 384
  layers: 8
  heads: 6
  ffn: 1024
  block: 16
  grad_checkpoint: true
train:
  time_sampling: uniform
  seed: 1234
  epochs: 0.25
  batch_windows: 64
  micro_batch: 8
  precision: fp16
  lr: 0.0003
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  clip: 1.0
  ema: 0.999
  warmup_fraction: 0.01
  decay_fraction: 0.2
  log_every: 10
  save_every: 250
  milestones: []
  run_dir: runs/tinystories_cpt_uniform
  max_steps: 0
storage:
  project_limit_gib: 16.0
  reserve_gib: 1.0
  require_quota: true
sample:
  steps: 32
  units: 128
  seed: 42
