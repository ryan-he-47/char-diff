data:
  cache: data/tinystories
  window: 512
  block: 16
  carry: 128
model:
  family: gmm_ar
  latent_dim: 48
  width: 384
  layers: 12
  heads: 6
  ffn: 1024
  components: 16
  sigma_floor: 0.05
  grad_checkpoint: true
train:
  prediction_type: gmm_ar
  loss_space: nll
  time_sampling: uniform
  seed: 1234
  epochs: 2.0
  batch_windows: 64
  micro_batch: 8
  precision: fp16
  lr: 0.0003
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  clip: 1.0
  ema: 0.999
  warmup_fraction: 0.01
  decay_fraction: 0.2
  log_every: 10
  save_every: 250
  milestones: [1.0]
  run_dir: runs/tinystories_gmm_ar_22m
  max_steps: 0
storage:
  project_limit_gib: 16.0
  reserve_gib: 1.0
  require_quota: true
